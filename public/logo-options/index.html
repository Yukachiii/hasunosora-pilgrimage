<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f7f7f2" />
    <title>蓮ノ旅 ロゴ候補</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
        color: #263446;
        background: #f7f7f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 10% 0%, rgb(217 239 242 / 45%), transparent 34rem),
          #f7f7f2;
      }

      main {
        width: min(100% - 32px, 960px);
        margin-inline: auto;
        padding: 56px 0 80px;
      }

      header {
        margin-bottom: 36px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #6aaebc;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.14em;
      }

      h1,
      h2 {
        font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
        font-weight: 500;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 7vw, 58px);
        letter-spacing: 0.08em;
      }

      header p:last-child {
        max-width: 38rem;
        margin: 14px 0 0;
        color: #687482;
        line-height: 1.8;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      article {
        overflow: hidden;
        border: 1px solid rgb(38 52 70 / 14%);
        border-radius: 24px;
        background: rgb(255 255 255 / 72%);
        box-shadow: 0 18px 44px rgb(38 52 70 / 8%);
      }

      .preview {
        display: grid;
        min-height: 220px;
        place-items: center;
        padding: 24px;
        border-bottom: 1px solid rgb(38 52 70 / 10%);
        background: #fbfaf6;
      }

      .preview img {
        display: block;
        width: 100%;
        height: auto;
      }

      .preview::after {
        content: none;
      }

      .copy {
        padding: 22px 24px 26px;
      }

      .number {
        display: inline-grid;
        width: 30px;
        height: 30px;
        margin-bottom: 14px;
        place-items: center;
        border-radius: 50%;
        background: #d9eff2;
        color: #263446;
        font-size: 12px;
        font-weight: 800;
      }

      h2 {
        margin: 0;
        font-size: 24px;
      }

      .copy p {
        min-height: 3.4em;
        margin: 10px 0 18px;
        color: #687482;
        font-size: 14px;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: inherit;
        font-size: 14px;
        font-weight: 800;
        text-underline-offset: 4px;
      }

      a::after {
        content: "↗";
      }

      @media (max-width: 680px) {
        main {
          width: min(100% - 24px, 480px);
          padding-top: 34px;
        }

        header {
          margin-bottom: 24px;
        }

        .grid {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        article {
          border-radius: 20px;
        }

        .preview {
          min-height: 164px;
          padding: 16px;
        }

        .copy {
          padding: 20px;
        }

        .copy p {
          min-height: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">LOGO STUDY / 4 OPTIONS</p>
        <h1>蓮ノ旅 ロゴ候補</h1>
        <p>画像を押すと、透過PNGを単体で開けます。</p>
      </header>

      <section class="grid" aria-label="ロゴ候補一覧">
        <article>
          <a class="preview" href="./logo-a-seal-route.png" aria-label="A 印章と旅路の画像を開く">
            <img src="./logo-a-seal-route.png" alt="丸い蓮の印と経路を組み合わせた蓮ノ旅のロゴ" />
          </a>
          <div class="copy">
            <span class="number">A</span>
            <h2>印章と旅路</h2>
            <p>現在の丸い「蓮」印を引き継ぎ、氷青色の経路を加えた案です。</p>
            <a href="./logo-a-seal-route.png">画像を開く</a>
          </div>
        </article>

        <article>
          <a class="preview" href="./logo-b-lotus-pin.png" aria-label="B 蓮と地図ピンの画像を開く">
            <img src="./logo-b-lotus-pin.png" alt="蓮の花弁と地点を組み合わせた蓮ノ旅のロゴ" />
          </a>
          <div class="copy">
            <span class="number">B</span>
            <h2>蓮と地図ピン</h2>
            <p>三枚の花弁と、経路・地点を一つの記号にまとめた案です。</p>
            <a href="./logo-b-lotus-pin.png">画像を開く</a>
          </div>
        </article>

        <article>
          <a class="preview" href="./logo-c-mizuhiki-route.png" aria-label="C 水引の旅路の画像を開く">
            <img src="./logo-c-mizuhiki-route.png" alt="水引と蓮と経路を組み合わせた蓮ノ旅のロゴ" />
          </a>
          <div class="copy">
            <span class="number">C</span>
            <h2>水引の旅路</h2>
            <p>金沢らしい水引を、蓮の花と旅の経路に見立てた案です。</p>
            <a href="./logo-c-mizuhiki-route.png">画像を開く</a>
          </div>
        </article>

        <article>
          <a class="preview" href="./logo-d-bookmark-guide.png" aria-label="D 旅のしおりの画像を開く">
            <img src="./logo-d-bookmark-guide.png" alt="しおりに蓮と訪問地点を収めた蓮ノ旅のロゴ" />
          </a>
          <div class="copy">
            <span class="number">D</span>
            <h2>旅のしおり</h2>
            <p>しおりの中に蓮と訪問地点を収めた、ガイドブック寄りの案です。</p>
            <a href="./logo-d-bookmark-guide.png">画像を開く</a>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
