name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build public site
        env:
          VITE_GOOGLE_MAPS_BROWSER_API_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: DEMO_MAP_ID
          VITE_ROUTE_API_URL: ${{ secrets.ROUTE_API_URL }}
        run: npm run build:pages

      - name: Publish generated site to gh-pages
        env:
          GH_PAGES_TOKEN: ${{ github.token }}
        run: |
          touch pages-dist/.nojekyll
          cd pages-dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_PAGES_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:gh-pages
